<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="880" height="400" viewBox="0 0 880 400" font-family="'Geist Mono', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
  <style>
    .l { opacity: 0; animation: in .35s ease forwards; }
    .l1 { animation-delay: .4s; } .l2 { animation-delay: 1.4s; } .l3 { animation-delay: 2s; }
    .l4 { animation-delay: 2.8s; } .l5 { animation-delay: 4.6s; } .l6 { animation-delay: 5.2s; }
    .l7 { animation-delay: 6.4s; } .l8 { animation-delay: 7.6s; } .l9 { animation-delay: 8.2s; }
    .l10 { animation-delay: 8.8s; } .l11 { animation-delay: 9.8s; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .l { animation: none; opacity: 1; } .cur { animation: none; } }
  </style>
  <defs>
    <linearGradient id="grad" x1="0" x2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#8b9cff"/></linearGradient>
  </defs>
  <rect width="880" height="400" rx="18" fill="#0a0e19"/>
  <rect x=".5" y=".5" width="879" height="399" rx="17.5" fill="none" stroke="rgba(148,170,220,.22)"/>
  <circle cx="26" cy="24" r="6" fill="#fb7185" opacity=".85"/><circle cx="46" cy="24" r="6" fill="#d7ff43" opacity=".85"/><circle cx="66" cy="24" r="6" fill="#5eead4" opacity=".85"/>
  <text x="440" y="29" fill="#66728c" font-size="13" text-anchor="middle">~ hiring a CMO</text>
  <line x1="0" y1="48" x2="880" y2="48" stroke="rgba(148,170,220,.12)"/>

  <g transform="translate(28 84)">
    <text class="l l1"><tspan fill="#5eead4">$</tspan><tspan fill="#eef2fb"> curl -fsSL https://kiqr.dev/install.sh | sh</tspan></text>
    <text class="l l2" y="28" fill="#9aa6bf">Installing KIQR (main)</text>
    <text class="l l3" y="52" fill="#9aa6bf">Building kiqr (this takes a few minutes the first time)...</text>
    <text class="l l4" y="76" fill="#66728c"># good moment for a coffee. Rust is thinking very hard.</text>
    <text class="l l5" y="100" fill="#9aa6bf">Daemon registered and started.</text>
    <text class="l l6" y="124" fill="#9aa6bf">KIQR is installed. Open http://127.0.0.1:7777</text>

    <text class="l l7" y="164"><tspan fill="#5eead4">$</tspan><tspan fill="#eef2fb"> kiqr project add https://your-bakery.com --watch</tspan></text>
    <text class="l l8" y="192"><tspan fill="#5eead4">  ✓</tspan><tspan fill="#9aa6bf"> read the whole website, every page</tspan></text>
    <text class="l l9" y="216"><tspan fill="#5eead4">  ✓</tspan><tspan fill="#9aa6bf"> business profile built, each fact with its source</tspan></text>
    <text class="l l10" y="240"><tspan fill="#5eead4">  ✓</tspan><tspan fill="#9aa6bf"> no interview, no salary negotiation, no onboarding deck</tspan></text>

    <g class="l l11">
      <circle cx="6" cy="275" r="5" fill="#d7ff43"/>
      <text x="20" y="280" fill="url(#grad)" font-weight="600">Seemo</text>
      <text x="80" y="280" fill="#eef2fb">I read the site. Shall we talk about the plan? <tspan class="cur" fill="#5eead4">▌</tspan></text>
    </g>
  </g>
</svg>
