# Google Search Console with the same service account as Analytics. Clicks,
# impressions, CTR and position per day, plus the top queries and pages.
id: search-console
name: Read Google Search Console
version: 0.1.0
summary: "Clicks, impressions, click-through rate and average position per day, with the top queries and pages, once a day into Performance. Needs the service account added as a user on the property."
categories: [analytics, seo]
icon: search
transport: builtin
homepage: https://developers.google.com/webmaster-tools/v1/searchanalytics/query
hosts: [searchconsole.googleapis.com, oauth2.googleapis.com]
auth:
  - { env: GSC_SITE_URL, label: Search Console property, help: "sc-domain:example.com for a domain property, or the exact URL for a URL-prefix property" }
  - { env: GOOGLE_SERVICE_ACCOUNT_FILE, label: Service account key file, help: "Path on this machine to the JSON key of a service account added as a user on the property" }
sources: [search]
